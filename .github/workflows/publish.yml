name: Publish NuGet package

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Optional package version override (for example 0.2.0 or 0.2.0-preview.1)
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/push the release tag and the GitHub release
      id-token: write   # OIDC token for NuGet trusted publishing
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve version and release commit
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.package_version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT_VERSION#v}"
          if [[ -z "$VERSION" ]]; then
            VERSION=$(grep -oP '(?<=<Version>)[^<]+' src/DotnetGitmoji/DotnetGitmoji.csproj | head -n1)
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a valid version"
            exit 1
          fi
          TAG="v$VERSION"

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG exists; building that commit."
            git checkout --detach "$TAG"
          else
            echo "Tag $TAG not found; tagging $(git rev-parse --short HEAD) on the default branch."
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify csproj version matches
        shell: bash
        env:
          EXPECTED: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          ACTUAL=$(grep -oP '(?<=<Version>)[^<]+' src/DotnetGitmoji/DotnetGitmoji.csproj | head -n1)
          if [[ "$ACTUAL" != "$EXPECTED" ]]; then
            echo "::error::csproj <Version> is '$ACTUAL' at $(git rev-parse --short HEAD) but release version is '$EXPECTED'"
            exit 1
          fi

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore --nologo

      - name: Build
        run: dotnet build --configuration Release --no-restore --nologo

      - name: Test
        run: dotnet test --configuration Release --no-build --no-banner

      - name: Pack
        shell: bash
        run: |
          set -euo pipefail
          OUTPUT_DIR="${{ github.workspace }}/artifacts"
          mkdir -p "$OUTPUT_DIR"

          dotnet pack src/DotnetGitmoji/DotnetGitmoji.csproj \
            --configuration Release \
            --no-build \
            --nologo \
            --output "$OUTPUT_DIR" \
            /p:PackageVersion="${{ steps.resolve.outputs.version }}"

      - name: Upload package artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: nuget-packages
          path: artifacts/*.nupkg

      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package to NuGet.org
        run: dotnet nuget push "${{ github.workspace }}/artifacts/*.nupkg" --source "https://api.nuget.org/v3/index.json" --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3.0.0
        with:
          tag_name: v${{ steps.resolve.outputs.version }}
          name: v${{ steps.resolve.outputs.version }}
          generate_release_notes: true
          files: artifacts/*.nupkg
